# Dashboard theme: Stark Industries HUD. Deep navy canvas, arc-reactor cyan, Orbitron headings.
[theme]
base = "dark"
backgroundColor = "#060b14"
secondaryBackgroundColor = "#0b1626"
primaryColor = "#2de2e6"
textColor = "#cfeaf2"
borderColor = "#16405a"
linkColor = "#2de2e6"
font = "'Rajdhani', 'Helvetica Neue', Helvetica, Arial, sans-serif"
headingFont = "'Orbitron', 'Rajdhani', sans-serif"
headingFontWeights = 600
baseRadius = "0.3rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#0f2238"
