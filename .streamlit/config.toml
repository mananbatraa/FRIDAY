# Dashboard theme: warm analog / editorial. Cream canvas, espresso ink, serif headings.
[theme]
base = "light"
backgroundColor = "#fcfaf7"
secondaryBackgroundColor = "#f4eee6"
primaryColor = "#1e1b18"
textColor = "#1e1b18"
borderColor = "#eaddcf"
linkColor = "#3d5a45"
font = "'Inter', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
headingFont = "Georgia, 'Times New Roman', serif"
headingFontWeights = 500
baseRadius = "0.6rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#f7f2ec"
